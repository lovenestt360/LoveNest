<!doctype html>
<html lang="pt"><head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>LoveNest Direções A B C</title>
<meta name="description" content="Protótipo isolado de exploração do sistema visual do LoveNest. Três direções, as mesmas superfícies, nenhuma escolhida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Karla:wght@400;500;600&family=Geist:wght@400;500;600&display=swap">
<style>
/* ───────────────────────── Viewer chrome (neutral, not part of any direction) ─────────────────────────
   Layout: barra de controlo no topo; abaixo, ou três colunas A|B|C da mesma superfície, ou uma grelha de todas as superfícies de uma direção. */
:root{
  --v-bg:#EEEFF1; --v-panel:#FFFFFF; --v-ink:#1A1C20; --v-muted:#62666E; --v-rule:#D9DBDF; --v-focus:#2F5BD3; --v-chip:#E3E5E9;
  --v-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--v-bg:#16181C;--v-panel:#1F2228;--v-ink:#ECEDEF;--v-muted:#A2A7B0;--v-rule:#30343B;--v-focus:#8DB0FF;--v-chip:#2A2E35;color-scheme:dark}}
:root[data-theme="dark"]{--v-bg:#16181C;--v-panel:#1F2228;--v-ink:#ECEDEF;--v-muted:#A2A7B0;--v-rule:#30343B;--v-focus:#8DB0FF;--v-chip:#2A2E35;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--v-bg);color:var(--v-ink);font:14px/1.45 var(--v-font)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--v-focus);outline-offset:2px}
.v-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--v-panel);border-bottom:1px solid var(--v-rule)}
.v-top-in{max-width:1500px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.v-title{font-weight:600;font-size:14px;margin-right:auto;min-width:0}
.v-title small{display:block;font-weight:400;color:var(--v-muted);font-size:12px}
.v-seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.v-seg span{font-size:12px;color:var(--v-muted);margin-right:4px}
.v-btn{border:1px solid var(--v-rule);background:transparent;border-radius:6px;padding:6px 10px;cursor:pointer;min-height:34px;font-size:13px}
.v-btn[aria-pressed="true"]{background:var(--v-ink);color:var(--v-panel);border-color:var(--v-ink)}
select.v-sel{font:inherit;font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid var(--v-rule);background:var(--v-panel);color:var(--v-ink);min-height:34px;max-width:100%}
.v-main{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.v-note{font-size:12.5px;color:var(--v-muted);margin:0 0 16px;max-width:90ch}
.v-cols{display:grid;grid-template-columns:1fr;gap:28px}
@media (min-width:1000px){.v-cols{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
.v-col{min-width:0}
.v-colhead{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.v-colhead b{font-size:15px}
.v-colhead em{font-style:normal;color:var(--v-muted);font-size:12.5px}
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 20px}
.v-cell{min-width:0}
.v-cell h3{font-size:13px;font-weight:600;margin:0 0 8px}
.v-cap{font-size:12px;color:var(--v-muted);margin-top:8px;max-width:60ch}
.frame-wrap{position:relative;width:100%}
.frame-scale{transform-origin:top left}
.v-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--v-chip);color:var(--v-muted)}
.v-tbl{overflow-x:auto;border:1px solid var(--v-rule);border-radius:8px;background:var(--v-panel);margin-top:12px}
.v-tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
.v-tbl th,.v-tbl td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--v-rule)}
.v-tbl th{font-weight:600;color:var(--v-muted);font-size:12px}
.v-tbl tr:last-child td{border-bottom:0}

/* ───────────────────────── Device frames ───────────────────────── */
.phone{width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 20px 50px -20px rgba(0,0,0,.35);background:#fff;isolation:isolate}
.phone .sb{position:absolute;inset:0 0 auto 0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 14px/1 system-ui,sans-serif;z-index:30;pointer-events:none}
.phone .sb i{display:inline-block;width:42px;height:11px;border-radius:3px;background:currentColor;opacity:.85;clip-path:polygon(0 70%,12% 70%,12% 45%,24% 45%,24% 25%,36% 25%,36% 0,48% 0,48% 100%,0 100%,0 70%, 60% 15%,100% 15%,100% 85%,60% 85%)}
.phone .hi{position:absolute;left:50%;bottom:8px;width:120px;height:4px;border-radius:2px;background:currentColor;opacity:.85;transform:translateX(-50%);z-index:40;pointer-events:none}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.desk{width:1440px;height:900px;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 20px 50px -24px rgba(0,0,0,.35);background:#fff}
.board{width:420px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.1);background:#fff}

/* placeholders */
.ph{position:relative;display:flex;align-items:flex-end;overflow:hidden}
.ph .phl{position:relative;z-index:1;padding:10px 12px;font:500 11px/1.35 system-ui,sans-serif;color:rgba(0,0,0,.62);max-width:92%}
.ph .phl b{display:block;font-weight:700;color:rgba(0,0,0,.72);margin-bottom:2px}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.035) 0 1px,transparent 1px 9px)}

/* ═════════════════════════ DIRECTION A — QUIETO ═════════════════════════
   Ideia: o LoveNest como um quarto calmo. Canvas branco, tipografia faz tudo, filetes em vez de caixas. */
.A{--ink:#18202E;--ink2:#3B4352;--mute:#6C717C;--hair:#E9EAEC;--canvas:#FFFFFF;--soft:#F4F4F5;--you:#C9567A;--par:#4767C6;--ph:#ECEBE7;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;
  --e:cubic-bezier(.2,0,0,1);
  background:var(--canvas);color:var(--ink);font:400 15px/1.5 var(--sans);letter-spacing:-.003em}
.A .pad{padding:0 24px}
.A .top{padding:58px 24px 0;display:flex;justify-content:space-between;align-items:center}
.A .date{font-size:13px;color:var(--mute)}
.A .duo{display:flex}
.A .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--sans);color:#fff;border:2px solid var(--canvas)}
.A .av.y{background:var(--you)} .A .av.p{background:var(--par);margin-left:-9px}
.A .names{font:400 40px/1.02 var(--serif);letter-spacing:-.01em;margin:26px 0 6px}
.A .together{font:italic 400 19px/1.3 var(--serif);color:var(--ink2)}
.A .together .n{font-style:normal}
.A .sec{margin-top:30px}
.A .sec h2{font:600 13px/1 var(--sans);color:var(--mute);margin:0 0 10px;letter-spacing:0}
.A .row{display:flex;gap:14px;align-items:baseline;padding:13px 0;border-top:1px solid var(--hair)}
.A .row:last-child{border-bottom:1px solid var(--hair)}
.A .row .t{font:500 14px/1.3 var(--sans);color:var(--mute);width:46px;flex:none;font-variant-numeric:tabular-nums}
.A .row .bd{min-width:0;flex:1}
.A .row .bd p{margin:0}
.A .row .bd .s{color:var(--mute);font-size:13.5px;margin-top:2px}
.A .pres{display:grid;gap:12px;margin-top:22px}
.A .pr{display:flex;gap:12px;align-items:center;font-size:15px}
.A .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1.75px solid currentColor}
.A .dot.on{background:currentColor}
.A .pr .who{font-weight:600}
.A .pr .when{color:var(--mute)}
.A .link{background:none;border:0;padding:10px 0;font:600 15px/1 var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;cursor:pointer;min-height:44px}
.A .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;border:0;background:var(--ink);color:#fff;font:600 15px/1 var(--sans);cursor:pointer;transition:transform .16s var(--e)}
.A .btn:active{transform:scale(.98)}
.A .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--hair)}
.A .flame{display:flex;align-items:center;gap:10px}
.A .ticks{display:flex;gap:5px;margin-top:10px}
.A .tk{width:22px;height:6px;border-radius:3px;background:var(--hair)}
.A .tk.full{background:var(--ink)} .A .tk.h{background:linear-gradient(90deg,var(--ink) 50%,var(--hair) 50%)}
.A .ph{background:var(--ph);border-radius:12px}
.A .cap{font-size:13px;color:var(--mute);margin-top:8px}
.A .fine{font-size:13.5px;color:var(--mute)}
.A .fine a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair)}
.A .h1{font:400 34px/1.05 var(--serif);margin:0}
.A .lede{color:var(--ink2);font-size:15.5px;margin:8px 0 0}
.A .nav{position:absolute;left:0;right:0;bottom:0;background:var(--canvas);border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 26px;z-index:20}
.A .nav.n4{grid-template-columns:repeat(4,1fr)}
.A .nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;justify-content:center;color:var(--mute);font:500 11.5px/1 var(--sans);cursor:pointer}
.A .nav button[aria-current]{color:var(--ink);font-weight:600}
.A .idx{columns:2;column-gap:20px;margin-top:6px}
.A .idx a{display:flex;justify-content:space-between;break-inside:avoid;padding:11px 0;border-top:1px solid var(--hair);color:var(--ink);text-decoration:none;font-size:15px}
.A .idx a span{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.A .quote{font:400 26px/1.2 var(--serif);margin:0}
.A .msgs{padding:124px 18px 120px;display:flex;flex-direction:column;gap:6px}
.A .m{max-width:78%;font-size:15.5px;line-height:1.4}
.A .m.p{align-self:flex-start;padding:4px 0}
.A .m.p .who{font-size:12px;color:var(--par);font-weight:600;display:block;margin-bottom:1px}
.A .m.y{align-self:flex-end;background:var(--soft);border-radius:18px 18px 6px 18px;padding:9px 13px}
.A .m .tm{font-size:11.5px;color:var(--mute);margin-left:6px}
.A .day{align-self:center;font:italic 15px/1 var(--serif);color:var(--mute);margin:12px 0}
.A .chathead{position:absolute;inset:0 0 auto 0;padding:52px 18px 12px;background:var(--canvas);border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:12px;z-index:5}
.A .composer{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 30px;background:var(--canvas);display:flex;gap:8px;align-items:center;border-top:1px solid var(--hair)}
.A .field{flex:1;min-height:44px;border-radius:22px;background:var(--soft);display:flex;align-items:center;padding:0 16px;color:var(--mute);font-size:15.5px}
.A .ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.A .ib.solid{background:var(--ink);color:#fff}
.A .scrim{position:absolute;inset:0;background:rgba(24,32,46,.28);z-index:25;animation:aFade .2s var(--e)}
.A .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--canvas);border-radius:22px 22px 0 0;padding:10px 24px 40px;z-index:26;animation:aUp .26s var(--e)}
.A .grab{width:36px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 14px}
.A .sheet .opt{display:flex;gap:14px;align-items:center;min-height:52px;border-top:1px solid var(--hair);font-size:16px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;color:var(--ink)}
.A .sheet .opt.danger{color:#B3261E}
@keyframes aUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes aFade{from{opacity:0}}
.A .fillin{animation:aFill .32s var(--e)}
@keyframes aFill{from{transform:scale(.4)}to{transform:scale(1)}}
.A.desk .rail{position:absolute;inset:0 auto 0 0;width:220px;border-right:1px solid var(--hair);padding:36px 28px}
.A.desk .rail a{display:block;padding:9px 0;color:var(--mute);text-decoration:none;font-size:15px}
.A.desk .rail a[aria-current]{color:var(--ink);font-weight:600}

/* ═════════════════════════ DIRECTION B — DIÁRIO ═════════════════════════
   Ideia: um caderno partilhado. Cada dia é uma página: fotografia grande, frases em serifa, notas na margem. */
.B{--ink:#24262B;--ink2:#45474D;--mute:#73757B;--hair:#E7E5E1;--canvas:#FFFFFF;--paper:#F5F3EF;--you:#B4566C;--par:#4C6A9E;--ph:#E8E4DC;
  --serif:"Newsreader",Georgia,serif;--sans:"Karla",ui-sans-serif,system-ui,sans-serif;--e:cubic-bezier(.25,.1,.25,1);
  background:var(--canvas);color:var(--ink);font:400 15.5px/1.55 var(--sans)}
.B .pad{padding:0 22px}
.B .dl{padding:56px 22px 0;display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--mute)}
.B .dl b{font:500 15px/1 var(--serif);font-style:italic;color:var(--ink)}
.B .hd{font:500 33px/1.08 var(--serif);letter-spacing:-.012em;margin:18px 0 0;font-variation-settings:"opsz" 60}
.B .hd i{font-weight:400}
.B .by{margin-top:10px;font-size:14px;color:var(--ink2)}
.B .by .y{color:var(--you);font-weight:600} .B .by .p{color:var(--par);font-weight:600}
.B .ph{background:var(--ph);border-radius:4px}
.B .lead{margin-top:20px}
.B .cap{font:italic 400 14px/1.4 var(--serif);color:var(--mute);margin-top:8px}
.B .two{display:grid;grid-template-columns:1fr 112px;gap:18px;margin-top:22px}
.B h3{font:500 19px/1.2 var(--serif);margin:0 0 8px}
.B .ag{display:grid;grid-template-columns:46px 1fr;gap:4px 10px;font-size:15px}
.B .ag .t{font:500 16px/1.35 var(--serif);font-variant-numeric:oldstyle-nums}
.B .margin{font-size:13px;color:var(--ink2);line-height:1.45;border-left:1px solid var(--hair);padding-left:12px}
.B .margin .big{font:500 30px/1 var(--serif);color:var(--ink);display:block;margin-bottom:2px}
.B .pull{margin:26px 0 0;font:italic 400 22px/1.3 var(--serif);color:var(--ink)}
.B .pull small{display:block;font:500 13px/1.4 var(--sans);font-style:normal;color:var(--par);margin-top:6px}
.B .foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--hair);font-size:13.5px;color:var(--mute)}
.B .foot a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}
.B .cal{display:grid;grid-template-columns:repeat(7,8px);gap:5px;margin:8px 0 4px}
.B .cal i{width:8px;height:8px;border-radius:50%;background:var(--hair)} .B .cal i.full{background:var(--ink)} .B .cal i.h{background:linear-gradient(90deg,var(--ink) 50%,var(--hair) 50%)}
.B .btn{min-height:50px;padding:0 24px;border-radius:25px;border:0;background:var(--ink);color:#fff;font:600 15px/1 var(--sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.B .btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.25px var(--ink)}
.B .nav{position:absolute;left:0;right:0;bottom:0;background:var(--canvas);display:flex;justify-content:space-between;padding:4px 18px 26px;z-index:20;box-shadow:0 -1px 0 var(--hair)}
.B .nav button{background:none;border:0;min-height:48px;min-width:48px;font:500 14.5px/1 var(--sans);color:var(--mute);cursor:pointer;position:relative;padding:0 4px}
.B .nav button[aria-current]{color:var(--ink);font-weight:600}
.B .nav button[aria-current]::after{content:"";position:absolute;left:4px;right:4px;bottom:10px;height:2px;background:var(--ink);border-radius:1px}
.B .chap{display:grid;grid-template-columns:30px 1fr;gap:4px 10px;padding:12px 0;border-top:1px solid var(--hair)}
.B .chap .no{font:italic 500 17px/1.3 var(--serif);color:var(--mute)}
.B .chap .tt{font:500 18px/1.3 var(--serif)}
.B .chap .meta{grid-column:2;font-size:13.5px;color:var(--mute)}
.B .toc a{display:flex;align-items:baseline;gap:8px;padding:9px 0;color:var(--ink);text-decoration:none;font:400 17px/1.3 var(--serif)}
.B .toc a::after{content:"";flex:1;order:1;border-bottom:1px dotted #C9C6C0;transform:translateY(-4px)}
.B .toc a span{order:2;font:400 13.5px/1 var(--sans);color:var(--mute);font-variant-numeric:tabular-nums}
.B .msgs{padding:124px 20px 124px;display:flex;flex-direction:column;gap:14px}
.B .lt{max-width:84%}
.B .lt .h{font-size:12.5px;font-weight:600;margin-bottom:3px}
.B .lt .tx{font:400 17px/1.45 var(--serif)}
.B .lt.p{align-self:flex-start} .B .lt.p .h{color:var(--par)}
.B .lt.y{align-self:flex-end;text-align:right} .B .lt.y .h{color:var(--you)}
.B .lt.y .tx{background:var(--paper);padding:9px 14px;border-radius:14px 14px 4px 14px;text-align:left;display:inline-block}
.B .lt.p .tx{padding:0}
.B .lt .tm{font:400 12px/1 var(--sans);color:var(--mute);font-weight:400;margin-left:6px}
.B .daysep{align-self:center;font:italic 400 16px/1 var(--serif);color:var(--mute);margin:6px 0}
.B .chathead{position:absolute;inset:0 0 auto 0;padding:52px 20px 12px;background:var(--canvas);z-index:5;box-shadow:0 1px 0 var(--hair)}
.B .composer{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 30px;background:var(--canvas);box-shadow:0 -1px 0 var(--hair);display:flex;gap:10px;align-items:flex-end}
.B .field{flex:1;min-height:46px;border-bottom:1.25px solid var(--ink);display:flex;align-items:center;font:italic 400 17px/1 var(--serif);color:var(--mute);padding:0 2px}
.B .ib{width:46px;height:46px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.B .scrim{position:absolute;inset:0;background:rgba(36,38,43,.22);z-index:25;animation:bF .24s var(--e)}
.B .sheet{position:absolute;left:12px;right:12px;bottom:30px;background:var(--canvas);border-radius:18px;padding:18px 22px 10px;z-index:26;box-shadow:0 24px 60px -20px rgba(36,38,43,.45);animation:bUp .28s var(--e)}
.B .sheet .q{font:italic 400 17px/1.4 var(--serif);color:var(--ink2);margin:0 0 10px}
.B .sheet .opt{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--hair);min-height:50px;font:500 16px/1 var(--sans);color:var(--ink);cursor:pointer}
.B .sheet .opt.danger{color:#A4262C}
@keyframes bUp{from{transform:translateY(24px);opacity:0}}
@keyframes bF{from{opacity:0}}
.B.desk .mast{height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-bottom:1px solid var(--hair)}
.B.desk .mast nav{display:flex;gap:30px}
.B.desk .mast nav a{color:var(--mute);text-decoration:none;font-size:15px;padding-bottom:4px}
.B.desk .mast nav a[aria-current]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}

/* ═════════════════════════ DIRECTION C — PRESENÇA ═════════════════════════
   Ideia: duas presenças como sistema vivo. Um componente próprio (o Par) mostra presença e convergência. */
.C{--ink:#0E1828;--ink2:#36404F;--mute:#68717F;--hair:#E3E6EB;--canvas:#F6F7F9;--surf:#FFFFFF;--you:#E9547A;--par:#3F66E8;--ph:#E3E7EE;
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;--e:cubic-bezier(.3,0,0,1);
  background:var(--canvas);color:var(--ink);font:400 15px/1.45 var(--sans);letter-spacing:-.006em}

    </div>
  </div>
  <div style="padding:20px 24px;border-top:1px solid var(--hair)">
    ${m.type.map(([f,r,v,s])=>`<div style="margin-bottom:12px"><p style="margin:0;font:${d==="C"?600:400} ${s}px/1.1 ${v};letter-spacing:${d==="C"?"-.03em":"-.005em"}">${f}</p><p style="margin:3px 0 0;font-size:13px;color:var(--mute)">${r}</p></div>`).join("")}
  </div>
  <div style="padding:16px 24px 20px;border-top:1px solid var(--hair)">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px">${m.pal.map(([n,h,u])=>`<div><div style="height:38px;border-radius:${d==="B"?4:d==="A"?8:10}px;background:${h};box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div><p style="margin:5px 0 0;font-size:12.5px;font-weight:600">${n}</p><p style="margin:0;font-size:11.5px;color:var(--mute);line-height:1.3">${u}</p></div>`).join("")}</div>
    <p style="margin:14px 0 0;font-size:13px">Rosa e azul nunca são género: na perspetiva de quem usa a app, rosa sou eu e azul é o meu par.</p>
  </div>
  <dl style="margin:0;padding:16px 24px 22px;border-top:1px solid var(--hair);display:grid;gap:10px;font-size:13.5px">
    ${[["Personalidade",m.pers],["Ambiente",m.mood],["Espaço",m.space],["Raios",m.radii],["Superfícies",m.surf],["Ícones",m.icons],["Motion",m.motion],["Fotografia",m.photo],["Vantagens",m.pros],["Riscos",m.risks],["O que a torna genérica",m.generic]].map(([k,v])=>`<div><dt style="font-weight:600">${k}</dt><dd style="margin:2px 0 0;color:var(--ink2,var(--ink))">${v}</dd></div>`).join("")}
  </dl>
  <div style="padding:0 24px 24px">${ph("100%","170px","shot brief",m.shot,"border-radius:"+(d==="B"?"4px":"12px"))}</div>
  </div>`;
};

/* ───────── Catálogo de superfícies ───────── */
const SURF = [
  ["board","Brand board","Símbolo, wordmark, tipografia, paleta, espaço, raios, superfícies, ícones, motion, fotografia."],
  ["welcome","Welcome · entrada","Primeiro ecrã em telemóvel."],
  ["home","Hoje · casal","Tempo juntos, Nossa Chama e Jornada visíveis e separados. Toca em “Estou aqui” para ver a microinteração."],
  ["homeSolo","Hoje · solo","Modo individual com a mesma dignidade."],
  ["chat","Chat","Toca na mensagem “Combinado…” para abrir o menu."],
  ["chatSheet","Chat · menu contextual","Menu de uma mensagem."],
  ["nos","Nós","Primeira camada com conteúdo; funcionalidades por baixo."],
  ["nosEmpty","Nós · estado vazio","Sem momentos guardados."],
  ["vida","Vida","O que está combinado; ferramentas por baixo."],
  ["perfil","Perfil","Centrado nas pessoas; definições em lista."],
  ["nav","Navegação","Barra inferior, estado ativo e versão solo."],
  ["presence","Presença Tu/Par","Detalhe de presença ou toque recebido."],
  ["ceremony","Guardião e cerimónia","Novo nível, na nova linguagem. Tratamento do Guardião é conceptual."],
  ["dHome","Desktop · Hoje 1440","Composição própria para ecrã largo."],
  ["dNos","Desktop · Nós 1440","Segunda superfície em desktop."],
];
const render1 = (d, key) => {
  const s = S[d];
  const phone = (inner) => `<div class="phone ${d}"><div class="sb" style="color:var(--ink)"><span>${D.time}</span><i></i></div>${inner}<div class="hi" style="color:var(--ink)"></div></div>`;
  switch(key){
    case "board": return {html:board(d), w:420};
    case "welcome": return {html:phone(s.welcome()), w:390};
    case "home": return {html:phone(s.home()), w:390};
    case "homeSolo": return {html:phone(s.home(true)), w:390};
    case "chat": return {html:phone(s.chat(STATE.sheet)), w:390};
    case "chatSheet": return {html:phone(s.chat(true)), w:390};
    case "nos": return {html:phone(s.nos()), w:390};
    case "nosEmpty": return {html:phone(s.nos(true)), w:390};
    case "vida": return {html:phone(s.vida()), w:390};
    case "perfil": return {html:phone(s.perfil()), w:390};
    case "nav": { const N=NAV[d]; return {html:`<div class="board ${d}" style="width:390px;background:var(--canvas);padding:16px 0 0">${["home","chat","nos"].map(k=>`<div style="position:relative;height:90px">${N(k)}</div>`).join("")}<p style="margin:12px 16px 4px;font-size:12.5px;color:var(--mute)">Modo solo (sem Chat, “Eu” em vez de “Nós”)</p><div style="position:relative;height:90px">${N("nos",true)}</div></div>`, w:390}; }
    case "presence": return {html:phone(s.presence()), w:390};
    case "ceremony": return {html:phone(s.ceremony()), w:390};
    case "dHome": return {html:s.desktopHome(), w:1440, desk:true};
    case "dNos": return {html:s.desktopNos(), w:1440, desk:true};
  }
};
const NAMES = {A:"A · Quieto",B:"B · Diário",C:"C · Presença"};
const TAG = {A:"minimalismo íntimo",B:"editorial humano",C:"produto contemporâneo"};

/* ───────── Viewer ───────── */
const V = { view:"compare", surf:"home", dir:"A" };
try { const s = JSON.parse(localStorage.getItem("ln-proto")||"{}"); Object.assign(V, s); } catch(e){}
const save = () => { try { localStorage.setItem("ln-proto", JSON.stringify(V)); } catch(e){} };
const sel = document.getElementById("surf");
sel.innerHTML = SURF.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
const out = document.getElementById("out");

const framed = (d, key) => {
  const r = render1(d, key);
  return `<div class="frame-wrap" data-w="${r.w}"><div class="frame-scale" style="width:${r.w}px">${r.desk?r.html:r.html}</div></div>`;
};
const TABLE = () => `<p class="v-note">Leitura descritiva das três direções face aos critérios do brief. Não há pontuação nem vencedor.</p><div class="v-tbl"><table><thead><tr><th>Critério</th><th>A · Quieto</th><th>B · Diário</th><th>C · Presença</th></tr></thead><tbody>${[
 ["Identidade própria","Vem da escrita e da serifa nos nomes. Discreta.","A mais reconhecível: caderno, frases, fotografia.","Vem do componente Par e da convergência dos discos."],
 ["Calma e intimidade","Máxima calma. Intimidade depende do texto.","Máxima intimidade. Calma depende da fotografia.","Calma moderada; mais energia de produto."],
 ["Clareza e hierarquia","Linear, de cima para baixo. Muito clara.","Narrativa; o essencial está numa frase.","A mais explícita: presença, três medidas, agora."],
 ["Tempo juntos · Chama · Jornada","Três registos tipográficos diferentes.","Frase, nota na margem, rodapé.","Três colunas com nomes próprios."],
 ["Excesso de cartões","Nenhum cartão nas superfícies principais.","Nenhum; a página e a foto estruturam.","Um único componente branco por ecrã; o resto em listas."],
 ["Suporta produto real","Sim; o padrão de linha serve todas as funções.","Sim, mas Vida e Perfil pedem mais disciplina.","Sim; é a mais modular."],
 ["S25+ e desktop","Desktop em três colunas com chat ao lado.","Desktop como revista; a mais forte em ecrã grande.","Desktop como app com barra lateral e chat fixo."],
 ["Acessibilidade","Alto contraste; alvos de 44–52 px.","Navegação só com palavras exige rótulos claros; contraste bom.","Alto contraste; alvos de 46–58 px."],
 ["Motion","Mínimo e funcional.","Folhear dias; lento e suave.","Assinatura própria (convergência); a mais rica."],
 ["Escalabilidade","Alta.","Média; depende de fotografia e escrita.","Alta."],
 ["Diferença face às outras","Tipografia sobre canvas branco.","Fotografia e serifa como estrutura.","Componentes e motion como estrutura."],
].map(r=>`<tr>${r.map((c,i)=>i?`<td>${c}</td>`:`<th scope="row" style="color:var(--v-ink)">${c}</th>`).join("")}</tr>`).join("")}</tbody></table></div>`;

const render = () => {
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.view===V.view)));
  document.querySelectorAll("[data-dir]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.dir===V.dir)));
  document.getElementById("dirWrap").hidden = V.view!=="dir";
  document.getElementById("surfWrap").hidden = V.view!=="compare";
  sel.value = V.surf;
  if (V.view==="table") { out.innerHTML = TABLE(); return; }
  if (V.view==="compare") {
    const meta = SURF.find(s=>s[0]===V.surf);
    out.innerHTML = `<p class="v-note"><span class="v-tag">Exploração</span> ${meta[2]} Conteúdo de exemplo: Ana a usar a app, com o Miguel. Fotografias são marcações provisórias.</p>
      <div class="v-cols" ${V.surf.startsWith("d")?'style="grid-template-columns:1fr;gap:36px"':""}>${["A","B","C"].map(d=>`<section class="v-col"><div class="v-colhead"><b>${NAMES[d]}</b><em>${TAG[d]}</em></div>${framed(d,V.surf)}</section>`).join("")}</div>`;
  } else {
    out.innerHTML = `<p class="v-note"><span class="v-tag">Exploração</span> Todas as superfícies da direção ${NAMES[V.dir]}. Toca nos elementos interativos indicados na legenda.</p>
      <div class="v-grid">${SURF.filter(s=>!s[0].startsWith("d")).map(([k,l,c])=>`<div class="v-cell"><h3>${l}</h3>${framed(V.dir,k)}<p class="v-cap">${c}</p></div>`).join("")}</div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr);gap:28px;margin-top:32px">${SURF.filter(s=>s[0].startsWith("d")).map(([k,l,c])=>`<div class="v-cell"><h3>${l}</h3>${framed(V.dir,k)}<p class="v-cap">${c}</p></div>`).join("")}</div>`;
  }
  fit();
};
const fit = () => {
  document.querySelectorAll(".frame-wrap").forEach(w=>{
    const tw = +w.dataset.w; const inner = w.firstElementChild; const child = inner.firstElementChild;
    const sc = Math.min(1, w.clientWidth / tw);
    inner.style.transform = `scale(${sc})`;
    w.style.height = (child.offsetHeight * sc) + "px";
  });
};
window.addEventListener("resize", fit);
document.addEventListener("click", e => {
  const vb = e.target.closest("[data-view]"); if (vb) { V.view = vb.dataset.view; save(); render(); return; }
  const db = e.target.closest("[data-dir]"); if (db) { V.dir = db.dataset.dir; save(); render(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act==="present") { STATE.present = true; render(); }
  if (a.dataset.act==="sheet") { STATE.sheet = true; render(); }
  if (a.dataset.act==="close") { STATE.sheet = false; render(); }
});
sel.addEventListener("change", () => { V.surf = sel.value; STATE.present=false; STATE.sheet=false; save(); render(); });
document.fonts && document.fonts.ready.then(fit);
render();
})();
</script>
