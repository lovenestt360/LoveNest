<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>O teu código de confirmação</title>
</head>
<body style="margin:0;padding:0;background:#F6F4F1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#F6F4F1;">Usa este código para confirmar que és tu.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F4F1;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #ECE8E3;border-radius:28px;">
          <tr>
            <td style="padding:36px 32px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding:0 0 8px;">
                  <img src="https://www.lovenestt.com/email/guardiao.png" width="120" height="120" alt="Guardião, a chama do LoveNest" style="display:block;width:120px;height:120px;border:0;" />
                </td>
              </tr>
              <tr>
                <td align="center" style="padding:0 0 10px;font-size:26px;line-height:32px;font-weight:700;letter-spacing:-0.5px;color:#0B1324;">Confirma que és tu</td>
              </tr>
              <tr>
                <td align="center" style="padding:0 0 24px;font-size:15px;line-height:23px;color:#6B7280;">Escreve este código no LoveNest para continuares.</td>
              </tr>
              <tr>
                <td align="center" style="padding:0 0 12px;">
                  <span style="display:inline-block;padding:16px 28px;border:1px solid #ECE8E3;border-radius:16px;background:#FAF8F6;font-size:32px;font-weight:700;letter-spacing:8px;color:#0B1324;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</span>
                </td>
              </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 24px;border-top:1px solid #ECE8E3;text-align:center;font-size:12px;line-height:18px;color:#9CA3AF;">
              Não pediste este código? Ignora este email e muda a tua senha.
            </td>
          </tr>
        </table>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
          <tr>
            <td align="center" style="padding:20px 16px 0;font-size:12px;line-height:18px;color:#9CA3AF;">
              <strong style="color:#0B1324;font-weight:600;">LoveNest</strong> &middot; Um espaço privado para os dois<br />
              <a href="https://www.lovenestt.com" style="color:#9CA3AF;text-decoration:underline;">www.lovenestt.com</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
