<meta charset="utf-8">
<title>Comparar ícones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #F4F2EF; --ink: #0B1324; --muted: #6B7280; --line: #ECE8E3; --sub: #3A4150; color-scheme: light; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 60px; }
  .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 24px; }
  header h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; line-height: 1.55; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 18px; align-items: start; }
  .opt { background: #fff; border: 1px solid var(--line); border-radius: 26px; padding: 20px 18px; display: grid; gap: 16px; position: relative; }
  .opt.rec { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), 0 24px 50px -30px rgba(11,19,36,.35); }
  .badge { position: absolute; top: -11px; left: 18px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .04em; border-radius: 99px; padding: 5px 10px; }
  .opt h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; display: flex; gap: 8px; align-items: baseline; }
  .opt h2 span { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
  .opt p { margin: 0; font-size: 13px; color: var(--sub); line-height: 1.5; }
  .g9 { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px 6px; }
  .g9 figure { margin: 0; display: grid; justify-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); text-align: center; }
  .strip { display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .strip span { display: flex; gap: 5px; align-items: center; }
  .mini { border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: grid; gap: 10px; background: #FCFBFA; }
  .mini .t { font-size: 13px; font-weight: 600; color: var(--sub); display: flex; gap: 7px; align-items: center; }
  .mini .row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .pros { display: grid; gap: 6px; font-size: 12.5px; color: var(--sub); line-height: 1.45; }
  .pros div { display: flex; gap: 8px; } .pros i { font-style: normal; color: var(--muted); flex: none; }
  .why { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px; font-size: 13.5px; line-height: 1.6; color: var(--sub); }
  .why b { color: var(--ink); }
  svg { display: block; flex: none; overflow: visible; }
</style>

<div class="wrap">
  <header>
    <h1>Comparar os três modelos</h1>
    <p>Os mesmos ícones da Home em três estilos, lado a lado, com os símbolos de dentro dos cartões e um pedaço da Home. Escolhe A, B ou C.</p>
  </header>
  <div class="cols" id="cols"></div>
  <div class="why" id="why"></div>
</div>

<script>

const SHAPE = {

  serena: "M32.6 7.5C36.4 13.6 43.6 15.6 46 21.6 49.8 25.8 52.2 31 52.2 37.2A20.2 20.2 0 0 1 11.8 37.6C11.6 30.6 14.8 25.4 19 22 20.8 24.8 22.6 25.8 24 25.2 23.6 18.4 27.2 12 32.6 7.5Z",
  ericada: "M33 1.5C35 9.6 38.8 12 40.8 16.8 42.8 12.8 45.8 9.6 49.2 6.6 50.4 15.6 54.2 24 52.4 36.4A20.2 20.2 0 0 1 11.8 38.4C10.8 30.2 12.8 21.8 15.8 14.8 17.8 19.8 19.8 21.8 22.8 22.8 22.6 14.8 26.8 7.6 33 1.5Z",
  sono: "M33.4 13.5C36.6 18 42.4 19.6 45.4 24 49.8 27.6 52.2 32 52.2 37.4A20.2 20.2 0 0 1 11.8 37.6C11.8 31.6 14.6 27.4 18.6 24.6 20.4 26.6 22.4 27.2 23.8 26.6 24.6 20.6 28.4 16.4 33.4 13.5Z",
  caida: "M47 11.5C42.6 14.4 35.6 14.6 33.4 20 39.2 20.4 46.4 24.4 50.2 30.2 52 33 52.4 35.4 52.2 38.2A20.2 20.2 0 0 1 11.8 38.4C11.8 31.4 15.8 26 21.8 22.2 26 19.4 32.4 16.4 37 14.4 40.6 13 44 12.4 47 11.5Z",
};

/** @param {string} key @param {number} size @param {string} u prefixo único dos ids */
function moodFaceSvg(key, size, u) {
  if (!PAL[key]) key = "tranquilo";
  const [tip, core, body, edge, F] = PAL[key];
  const shape = { feliz: "viva", apaixonado: "viva", tranquilo: "serena", grato: "serena", ansioso: "viva", irritado: "ericada", triste: "caida", cansado: "sono" }[key];
  // olho da Faísca: grande, escuro, íris colorida e dois brilhos
  const eye = (x, y, rx = 4.3, ry = 5.2, look = 0) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${u}e)"/>
    <ellipse cx="${x}" cy="${y + ry * .45}" rx="${rx * .72}" ry="${ry * .38}" fill="${edge}" opacity=".55"/>
    <circle cx="${x - rx * .3 + look}" cy="${y - ry * .38}" r="${rx * .42}" fill="#fff"/>
    <circle cx="${x + rx * .38 + look}" cy="${y + ry * .3}" r="${rx * .18}" fill="#fff" opacity=".9"/>`;
  // traços afilados (preenchidos, não linhas de espessura igual)
  const arcUp = (x, y, w = 9, h = 6.2, t = 2.6) => `<path d="M${x - w / 2} ${y}Q${x} ${y - h} ${x + w / 2} ${y}Q${x} ${y - h + t * 1.6} ${x - w / 2} ${y}Z" fill="${F}"/>`;
  const arcDown = (x, y, w = 9, h = 5, t = 2.4) => `<path d="M${x - w / 2} ${y}Q${x} ${y + h} ${x + w / 2} ${y}Q${x} ${y + h - t * 1.6} ${x - w / 2} ${y}Z" fill="${F}"/>`;
  const brow = (x1, y1, x2, y2, bend = 1.4) => {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - bend;
    return `<path d="M${x1} ${y1}Q${mx} ${my - 1.6} ${x2} ${y2}Q${mx} ${my + 0.4} ${x1} ${y1}Z" fill="${F}" stroke="${F}" stroke-width=".6" stroke-linejoin="round"/>`;
  };
  const smile = (x, y, w, h) => `<path d="M${x - w / 2} ${y}Q${x} ${y + h} ${x + w / 2} ${y}Q${x} ${y + h * .55} ${x - w / 2} ${y}Z" fill="${F}"/>`;
  const frown = (x, y, w, h) => `<path d="M${x - w / 2} ${y}Q${x} ${y - h} ${x + w / 2} ${y}Q${x} ${y - h * .55} ${x - w / 2} ${y}Z" fill="${F}"/>`;
  const openMouth = (x, y, w, h) => `<path d="M${x - w / 2} ${y}Q${x} ${y - 1} ${x + w / 2} ${y}Q${x + w * .42} ${y + h} ${x} ${y + h}Q${x - w * .42} ${y + h} ${x - w / 2} ${y}Z" fill="url(#${u}m)"/>
    <ellipse cx="${x}" cy="${y + h * .72}" rx="${w * .26}" ry="${h * .26}" fill="#FF8BA0"/>`;
  const blush = `<ellipse cx="20.5" cy="46" rx="4.4" ry="2.6" fill="#FF5A86" opacity=".38" filter="url(#${u}b)"/><ellipse cx="43.5" cy="46" rx="4.4" ry="2.6" fill="#FF5A86" opacity=".38" filter="url(#${u}b)"/>`;
  const heart = (x, y, s, fill = `url(#${u}h)`) => `<g transform="translate(${x - 12 * s} ${y - 11 * s}) scale(${s})"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="${fill}"/><ellipse cx="7.6" cy="7.4" rx="2.6" ry="1.7" fill="#fff" opacity=".8" transform="rotate(-30 7.6 7.4)"/></g>`;
  const drop = (x, y, s = 1) => `<path d="M${x} ${y}q${-3.4 * s} ${5 * s} 0 ${7.4 * s} ${3.4 * s} ${-2.4 * s} 0 ${-7.4 * s}Z" fill="url(#${u}t)"/><ellipse cx="${x - .8 * s}" cy="${y + 4.2 * s}" rx="${.7 * s}" ry="${1.3 * s}" fill="#fff" opacity=".85"/>`;
  const FEAT = {
    feliz: () => blush + arcUp(24.5, 41) + arcUp(39.5, 41) + openMouth(32, 45.5, 10, 6.2),
    tranquilo: () => blush + arcDown(24.5, 39.5) + arcDown(39.5, 39.5) + smile(32, 46, 6.5, 3.2),
    apaixonado: () => blush + heart(24.5, 40.5, .5) + heart(39.5, 40.5, .5) + openMouth(32, 46.5, 7.5, 4.6) + heart(32, -1, .36),
    ansioso: () => brow(19.5, 32, 27, 30.4, -1.2) + brow(44.5, 32, 37, 30.4, -1.2) + eye(24.5, 39.5, 3.9, 5, -.5) + eye(39.5, 39.5, 3.9, 5, -.5)
      + `<path d="M26.5 48.2q1.4-1.8 2.8 0t2.8 0t2.8 0t2.8 0" fill="none" stroke="${F}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>` + drop(49, 22, .9),
    triste: () => brow(19.5, 33.4, 27.5, 31.2, 1.4) + brow(44.5, 33.4, 36.5, 31.2, 1.4) + eye(24.5, 40.5, 4.3, 5.2) + eye(39.5, 40.5, 4.3, 5.2) + frown(32, 50, 7, 3.4) + drop(19.5, 45, .9),
    cansado: () => `<g>${eye(24.5, 41, 4.1, 4.6)}<path d="M19.9 41.4Q24.5 34.6 29.1 41.4Z" fill="${body}"/><path d="M19.9 41.2Q24.5 39.6 29.1 41.2" fill="none" stroke="${F}" stroke-width="1.7" stroke-linecap="round"/></g>
      <g>${eye(39.5, 41, 4.1, 4.6)}<path d="M34.9 41.4Q39.5 34.6 44.1 41.4Z" fill="${body}"/><path d="M34.9 41.2Q39.5 39.6 44.1 41.2" fill="none" stroke="${F}" stroke-width="1.7" stroke-linecap="round"/></g>
      <ellipse cx="32" cy="49" rx="2.4" ry="2.9" fill="url(#${u}m)"/>
      <path d="M44.5 13.5h5.4l-5.4 5.4h5.4" fill="none" stroke="${edge}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 7.5h3.6l-3.6 3.6h3.6" fill="none" stroke="${edge}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>`,
    irritado: () => brow(18.5, 31.2, 28, 35, 0) + brow(45.5, 31.2, 36, 35, 0) + eye(24.5, 41.5, 3.9, 4.4) + eye(39.5, 41.5, 3.9, 4.4) + frown(32, 50.5, 9, 3.4)
      + `<g fill="#fff" opacity=".85"><circle cx="9" cy="30" r="2.2"/><circle cx="6.4" cy="27" r="1.6"/><circle cx="55" cy="30" r="2.2"/><circle cx="57.6" cy="27" r="1.6"/></g>`,
    grato: () => blush + arcUp(24.5, 41, 8.6, 5.4) + arcUp(39.5, 41, 8.6, 5.4) + smile(32, 46, 8, 4)
      + `<path d="M53 5l1.4 3.6 3.6 1.4-3.6 1.4L53 15l-1.4-3.6L48 10l3.6-1.4Z" fill="url(#${u}s)"/><path d="M10 16l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9Z" fill="url(#${u}s)"/>`,
  };
  const P = SHAPE[shape];
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true" style="overflow:visible">
    <defs>
      <radialGradient id="${u}g" cx=".5" cy=".7" r=".66"><stop offset="0" stop-color="${core}"/><stop offset=".5" stop-color="${body}"/><stop offset="1" stop-color="${edge}"/></radialGradient>
      <linearGradient id="${u}p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${tip}" stop-opacity=".95"/><stop offset=".42" stop-color="${tip}" stop-opacity="0"/></linearGradient>
      <radialGradient id="${u}c" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="${core}" stop-opacity="0"/></radialGradient>
      <radialGradient id="${u}l" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <radialGradient id="${u}e" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#3a2030"/><stop offset="1" stop-color="#12060c"/></radialGradient>
      <linearGradient id="${u}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${F}"/><stop offset="1" stop-color="#14060a"/></linearGradient>
      <linearGradient id="${u}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6A88"/><stop offset="1" stop-color="#C80E3E"/></linearGradient>
      <linearGradient id="${u}t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2EAFF"/><stop offset="1" stop-color="#3F8CFF"/></linearGradient>
      <linearGradient id="${u}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6C4"/><stop offset="1" stop-color="#FFB000"/></linearGradient>
      <filter id="${u}b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <filter id="${u}d" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
      <clipPath id="${u}x"><path d="${P}"/></clipPath>
    </defs>
    <ellipse cx="32" cy="60.5" rx="16" ry="2.6" fill="${body}" opacity=".55" filter="url(#${u}d)"/>
    <path d="${P}" fill="url(#${u}g)"/>
    <g clip-path="url(#${u}x)">
      <rect x="0" y="0" width="64" height="64" fill="url(#${u}p)"/>

}

const SETA = (() => {
const SQ = "M21.7 1h20.6C53.7 1 63 10.3 63 21.7v20.6C63 53.7 53.7 63 42.3 63H21.7C10.3 63 1 53.7 1 42.3V21.7C1 10.3 10.3 1 21.7 1Z";

const heartAt = (x, y, s, fill) => `<path transform="translate(${x - 12 * s} ${y - 11.5 * s}) scale(${s})" d="${HEART}" fill="${fill}"/>`;
const star4 = (x, y, r, fill) => `<path d="M${x} ${y - r}C${x + r * .18} ${y - r * .18} ${x + r * .18} ${y - r * .18} ${x + r} ${y}C${x + r * .18} ${y + r * .18} ${x + r * .18} ${y + r * .18} ${x} ${y + r}C${x - r * .18} ${y + r * .18} ${x - r * .18} ${y + r * .18} ${x - r} ${y}C${x - r * .18} ${y - r * .18} ${x - r * .18} ${y - r * .18} ${x} ${y - r}Z" fill="${fill}"/>`;

// fundo branco; o desenho a cores, com gradientes, luz e detalhe (mesmo acabamento da Faísca)

const shine = (id) => `<radialGradient id="${id}" cx=".3" cy=".2" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;

        <path d="M9 32.5C9 24.5 16.6 18.5 26 18.5S43 24.5 43 32.5 35.4 46.5 26 46.5c-1.7 0-3.3-.2-4.9-.6l-7.4 4.6c-.8.5-1.7-.2-1.5-1.1l1.4-5.9C10.8 41 9 36.9 9 32.5Z" fill="url(#${u}a)"/>

        <circle cx="38" cy="17.6" r="1.5" fill="#FF6B8E"/><circle cx="42.6" cy="17.6" r="1.5" fill="#FF6B8E"/><circle cx="47.2" cy="17.6" r="1.5" fill="#FF6B8E"/>

  agenda: { calendar: true },

  espiritual: { glyph: (u) => `<defs>${lg(u + "a", "#8E8CFF", "#5148D6")}${lg(u + "p", "#FFFFFF", "#ECEBFF")}${lg(u + "q", "#F4F3FF", "#DCDAFF")}${soft(u + "f")}</defs>

        <g stroke="#B9B6F5" stroke-width="1.3" stroke-linecap="round"><path d="M16.5 26c3.4-.4 6.8.2 10 1.8M16.5 31c3.4-.4 6.8.2 10 1.8M16.5 36c3.4-.4 6.8.2 10 1.8M37.5 27.8c3.2-1.6 6.6-2.2 10-1.8M37.5 32.8c3.2-1.6 6.6-2.2 10-1.8"/></g>
        <path d="M40 19.6v13l2.6-2 2.6 2V18.7c-1.8.1-3.5.4-5.2.9Z" fill="#FF5A7E"/>
        ${star4(32, 11.5, 4.2, "#FFC93C")}

  conflitos: { glyph: (u) => `<defs>${lg(u + "a", "#FF8A80", "#E8283B")}${lg(u + "b", "#FFF3E8", "#FFD9BF")}${shine(u + "s")}${soft(u + "f")}</defs>

const TILE = "M21.7 1h20.6C53.7 1 63 10.3 63 21.7v20.6C63 53.7 53.7 63 42.3 63H21.7C10.3 63 1 53.7 1 42.3V21.7C1 10.3 10.3 1 21.7 1Z";
const tile = (inner, size) => `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true" style="filter:drop-shadow(0 ${size * .08}px ${size * .12}px rgba(11,19,36,.08))"><path d="${TILE}" fill="#fff" stroke="#ECE8E3" stroke-width="1.4"/>${inner}</svg>`;
const icon = (kind, size = 56) => {
  if (kind === "agenda") return tile(`<text x="32" y="22" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10.5" font-weight="600" letter-spacing=".6" fill="#F2416B">SEX</text><text x="32" y="48.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="500" letter-spacing="-1" fill="#0B1324">23</text>`, size);
  if (kind === "humor") return tile(moodFaceSvg("feliz", 44, id()).replace("<svg ", '<svg x="10" y="8" '), size);
  const u = id(); const [a, b] = C[COLOR[kind]];
  return tile(`<defs>${grad(u, a, b)}</defs><g transform="translate(32 32) scale(${SCALE}) translate(-32 -32)">${D[kind](u, [a, b])}</g>`, size);
};
const heart = (on) => { const u = id(); return `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">${on ? `<defs>${grad(u, "#FF8FA8", "#F2416B")}</defs><path d="${HEART}" fill="url(#${u})"/>` : `<path d="${HEART}" fill="none" stroke="#D3CEC7" stroke-width="1.6"/>`}</svg>`; };
const shield = (on) => { const u = id(); const d = "M12 2.5l7.5 2.8v6.1c0 4.7-3.1 8.6-7.5 10.1-4.4-1.5-7.5-5.4-7.5-10.1V5.3Z"; return `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">${on ? `<defs>${grad(u, "#8CB2FF", "#3F6FF0")}</defs><path d="${d}" fill="url(#${u})"/>` : `<path d="${d}" fill="none" stroke="#D3CEC7" stroke-width="1.6"/>`}</svg>`; };


  return { icon, glyph, heart, shield };
}

const B = makeMin("b", {
  rosa: ["#FF8FA8", "#F2416B"], indigo: ["#9C97FF", "#625BE8"], coral: ["#FF9A8A", "#F0524A"], vinho: ["#FF93B3", "#E04B7E"],
  roxo: ["#C59BFF", "#9358F0"], verde: ["#6BDDA0", "#22B26A"], laranja: ["#FFC062", "#FF9500"], azul: ["#8CB2FF", "#3F6FF0"],
  chama: ["#FFAE6A", "#F5573A"], ceu: ["#8FD8FF", "#1AA3E8"], sol: ["#FFD36B", "#F5A00B"], lua: ["#BBA6FF", "#7A4FEA"],
}, .8);
// C: as mesmas formas, numa paleta quente e suave (tons da casa: rosa-pó, pêssego, lavanda, salva, céu)
const Cset = makeMin("c", {
  rosa: ["#F59AB0", "#E0587C"], indigo: ["#A9A3F0", "#7F78DD"], coral: ["#F7A493", "#E5735F"], vinho: ["#F09DB8", "#D2668D"],
  roxo: ["#C3A6F2", "#9C7BE0"], verde: ["#8FD3AE", "#4FAF82"], laranja: ["#F8C27E", "#EC9A45"], azul: ["#9DBAF2", "#5F87DE"],
  chama: ["#F9B183", "#EB7350"], ceu: ["#9FD6F0", "#4FAED8"], sol: ["#F7D27E", "#E8AB3E"], lua: ["#B9A6EE", "#8C70DB"],
}, .74);

let k = 0; const u = () => "a" + (k++);
const A = {
  icon: (kind, size) => SETA.featureIconSvg({ chat: "chat", humor: "humor", agenda: "agenda", espiritual: "espiritual", conflitos: "conflitos", historia: "historia", capsula: "capsula", desafios: "desafios", wrapped: "wrapped" }[kind], size, u(), { mood: "feliz" }),
  glyph: (kind, size, dim) => SETA.featureGlyphSvg(kind, size, u(), dim),
  heart: (on) => SETA.presenceHeartSvg(on, 16, u()),
  shield: (on) => SETA.shieldSvg(on, 15, u()),
};

const NAMES = [["chat", "Chat"], ["humor", "Humor"], ["agenda", "Agenda"], ["espiritual", "Espiritual"], ["conflitos", "Conflitos"], ["historia", "História"], ["capsula", "Cápsula"], ["desafios", "Desafios"], ["wrapped", "Wrapped"]];

function column(set, key, title, sub, text, pros, rec) {
  const small = `<span>${set.glyph("chama", 18)}${set.heart(true)}${set.heart(false)}${set.shield(true)}${set.shield(false)}</span>
    <span>${set.glyph("chat", 17)}${set.glyph("presenca", 17, true)}${moodFaceSvg("tranquilo", 17, key + "mf" + (k++))}${set.glyph("espiritual", 17, true)}</span>
    <span>${set.glyph("menstrual", 16)}${set.glyph("folicular", 16)}${set.glyph("ovulacao", 16)}${set.glyph("lutea", 16)}</span>`;
  return `<div class="opt${rec ? " rec" : ""}">${rec ? '<span class="badge">A minha recomendação</span>' : ""}
    <h2>${title}<span>${sub}</span></h2>
    <p>${text}</p>
    <div class="g9">${NAMES.map(([kd, l]) => `<figure>${set.icon(kd, 50)}<figcaption>${l}</figcaption></figure>`).join("")}</div>
    <div class="strip">${small}</div>
    <div class="mini">
      <div class="t">${set.glyph("chama", 16)}A vossa chama</div>
      <div class="row"><span><b style="color:var(--ink);font-size:20px">12</b> dias</span><span style="display:flex;gap:4px;align-items:center">${set.heart(true)}${set.heart(true)}<span style="width:8px"></span>${set.shield(true)}${set.shield(false)}${set.shield(false)}</span></div>
      <div class="t">${set.glyph("folicular", 15)}O teu ciclo · Folicular</div>
    </div>
    <div class="pros">${pros.map(([s, t]) => `<div><i>${s}</i>${t}</div>`).join("")}</div>
  </div>`;
}

document.getElementById("cols").innerHTML =
  column(A, "a", "A · Detalhado", "o que está na app", "Desenhos ricos, com luz, reflexos e pequenos pormenores (estrelas, linhas, areia, claquete).",
    [["+", "Muito expressivo e cheio de carácter."], ["−", "Pesado ao lado dos textos; muitos pormenores pequenos lado a lado cansam a vista."], ["−", "Junto com a Faísca, a Home fica com muito \"brilho\"."]]) +
  column(B, "b", "B · Minimalista", "uma forma, cores vivas", "Uma só forma por ícone, gradiente de dois tons, sem enfeites. Cores saturadas, ao estilo dos ícones do iPhone.",
    [["+", "Limpo e moderno, lê-se num relance."], ["−", "As cores vivas competem umas com as outras (rosa, laranja e verde fortes lado a lado)."], ["−", "Parece mais \"sistema\" do que LoveNest."]]) +
  column(Cset, "c", "C · Suave", "uma forma, paleta quente", "As formas simples do B, numa paleta quente e suave tirada da casa: rosa-pó, pêssego, lavanda, salva e céu. Um pouco mais de espaço à volta do desenho.",
    [["+", "Calmo e acolhedor, combina com a Faísca, o fundo branco e o rosa só como acento."], ["+", "Moderno e simples como o B, sem cores a gritar: agrada a mais gente, homens e mulheres."], ["+", "Identidade própria: a paleta é a do LoveNest, não a de um sistema."]], true);

document.getElementById("why").innerHTML = `<b>Porque recomendo o C.</b> O LoveNest é um espaço íntimo para o casal: o que funciona melhor é um design que transmite calma e confiança, não um painel de jogo. O C mantém a clareza do minimalista (uma forma, lê-se num segundo), mas troca as cores vivas por tons quentes e suaves que conversam entre si e com a Faísca. Fica bonito em qualquer telemóvel, não cansa com o uso diário e é a opção que mais pessoas acham agradável à primeira vista: moderna sem ser fria, carinhosa sem ser cor-de-rosa demais.`;
</script>
