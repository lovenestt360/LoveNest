<meta charset="utf-8">
<title>Home unificada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root { --bg: #F4F2EF; --ink: #0B1324; --muted: #6B7280; --line: #ECE8E3; --sub: #3A4150; color-scheme: light; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 60px; }
  .wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 26px; }
  header h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); font-size: 14px; max-width: 66ch; line-height: 1.55; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 28px; align-items: start; }
  .cap { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .phone { background: #fff; border: 1px solid var(--line); border-radius: 32px; padding: 18px 16px 24px; max-width: 400px; box-shadow: 0 24px 60px -34px rgba(11,19,36,.4); display: grid; gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 22px; background: #fff; box-shadow: 0 1px 2px rgba(11,19,36,.04), 0 10px 28px -14px rgba(11,19,36,.16); }
  .hd { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 6px; }
  .hd .mid { text-align: center; } .hd b { font-size: 19px; letter-spacing: -.02em; display: block; } .hd small { color: var(--muted); font-size: 12.5px; }
  .tag { text-align: center; color: #E5466D; font-size: 13.5px; font-weight: 500; margin-top: -4px; }
  .av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; position: relative; box-shadow: 0 0 0 2.5px #fff, 0 0 0 4.5px var(--ring); }
  .av i { position: absolute; right: -2px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; background: var(--dot); }
  .row { display: flex; align-items: center; gap: 10px; }
  .title { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .tt { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .tt .nums { display: flex; gap: 10px; align-items: baseline; margin-left: auto; }
  .tt .nums span { display: grid; justify-items: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tt .nums small { font-size: 9px; color: var(--muted); letter-spacing: .08em; font-weight: 600; }
  .tt .nums .d { color: #E5466D; font-size: 22px; }
  .ch { padding: 16px; }
  .big { font-size: 46px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: #E5466D; }
  .pres { display: flex; gap: 12px; font-size: 13px; font-weight: 600; color: var(--sub); }
  .pres span { display: inline-flex; align-items: center; gap: 4px; }
  .stages { display: flex; align-items: center; margin: 16px 2px 8px; }
  .stages i { width: 8px; height: 8px; border-radius: 50%; background: #E4E0DA; flex: none; }
  .stages i.done { background: #FF8A6B; } .stages i.now { width: 20px; height: 20px; background: radial-gradient(circle at 35% 30%, #FFB08F, #F2553C); box-shadow: 0 0 0 5px rgba(242,85,60,.15); }
  .stages b { flex: 1; height: 2px; background: #EAE6E0; } .stages b.done { background: #FFB8A3; }
  .foot { border-top: 1px solid var(--line); margin: 12px -16px -16px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
  .miss { display: flex; gap: 6px; }
  .cy { padding: 14px 16px; }
  .stages.calm i.done { background: #9AA0AA; } .stages.calm b.done { background: #C9CDD4; }
  .stages.calm i.now { width: 14px; height: 14px; background: var(--ink); box-shadow: 0 0 0 4px rgba(11,19,36,.08); }
  .bar { height: 6px; border-radius: 9px; background: #F1EEEA; margin: 10px 0 8px; overflow: hidden; } .bar i { display: block; height: 100%; width: 11%; border-radius: 9px; background: linear-gradient(90deg, #FF8FA9, #F2385E); }
  .map { height: 110px; border-radius: 22px 22px 0 0; background: #EFEBE5; position: relative; overflow: hidden; }
  .map:before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 32%, #fff 32%, #fff 34%, transparent 34%), linear-gradient(0deg, transparent 46%, #fff 46%, #fff 52%, transparent 52%); }
  .pin { position: absolute; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; border: 3px solid #fff; box-shadow: 0 6px 14px -6px rgba(0,0,0,.45); }
  .loc { padding: 12px 16px 14px; display: flex; gap: 12px; align-items: center; }
  .live { color: #0E9F6E; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; } .live:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #10B981; }
  .sec { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin: 10px 4px 2px; }
  .tools { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
  .tool { display: grid; justify-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: var(--sub); }
  .notes { display: grid; gap: 10px; }
  .note { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.45; }
  .note b { display: block; font-size: 13.5px; }
  svg { display: block; flex: none; overflow: visible; }
</style>

<div class="wrap">
  <header>
    <h1>Home com um só estilo</h1>
    <p>Versão calma: a Home fica como está, sem quadrados novos nem mais cor. Só os ícones de linha fina passam a pequenos desenhos do novo estilo, e o rosa sai dos números e textos para o design ficar limpo e coerente.</p>
  </header>

  <div class="cols">
    <section>
      <p class="cap">Home completa</p>
      <div class="phone" id="phone"></div>
    </section>
    <section>
      <p class="cap">O que muda</p>
      <div class="notes" id="notes"></div>
    </section>
  </div>
</div>

<script>
// Arte do Humor: a Faísca a sentir cada humor, as luas do sono e os quadradinhos das atividades.
// Gerado a partir de docs/mockups/humor-proposta.html (maqueta aprovada). Devolve SVG em texto.

// ponta, núcleo, corpo, borda, traços
const PAL = {
  feliz: ["#FFF6C2", "#FFE485", "#FFB830", "#EE760E", "#4A1F05"],
  tranquilo: ["#E4FFF5", "#AEF2DA", "#46CFA4", "#138C6A", "#0B3B2E"],
  apaixonado: ["#FFE9F0", "#FFC6D6", "#FF7FA3", "#DF3A6B", "#4E0B21"],
  ansioso: ["#F4F0FF", "#D9D0FF", "#A796FF", "#6A50E6", "#25186A"],
  triste: ["#EAF2FF", "#BDD5FF", "#6F9DFF", "#2D57D8", "#122560"],
  cansado: ["#F6F3FF", "#E0DBF0", "#B4AECB", "#716A8F", "#2A2540"],
  irritado: ["#FFE4CC", "#FFB580", "#FF6A3A", "#CF2B0E", "#4E1004"],
  grato: ["#FFF3E0", "#FFDBB2", "#FFAD68", "#E2722B", "#4E220A"],
};
// Silhuetas da chama (viewBox 64): viva, serena, eriçada, caída
const SHAPE = {
  viva: "M32 3.5C34.6 11.5 40.6 13 41.8 19.6 43.6 15.6 46.6 14.2 47.8 11.2 51.4 19.6 53.4 27.2 52.2 37A20.2 20.2 0 0 1 11.8 38.4C11 30.2 13.8 23.8 18 19.6 19.2 23.6 21.2 25.6 23.2 25.8 22 17.6 25.8 9.6 32 3.5Z",
  serena: "M32.6 7.5C36.4 13.6 43.6 15.6 46 21.6 49.8 25.8 52.2 31 52.2 37.2A20.2 20.2 0 0 1 11.8 37.6C11.6 30.6 14.8 25.4 19 22 20.8 24.8 22.6 25.8 24 25.2 23.6 18.4 27.2 12 32.6 7.5Z",
  ericada: "M33 1.5C35 9.6 38.8 12 40.8 16.8 42.8 12.8 45.8 9.6 49.2 6.6 50.4 15.6 54.2 24 52.4 36.4A20.2 20.2 0 0 1 11.8 38.4C10.8 30.2 12.8 21.8 15.8 14.8 17.8 19.8 19.8 21.8 22.8 22.8 22.6 14.8 26.8 7.6 33 1.5Z",
  sono: "M33.4 13.5C36.6 18 42.4 19.6 45.4 24 49.8 27.6 52.2 32 52.2 37.4A20.2 20.2 0 0 1 11.8 37.6C11.8 31.6 14.6 27.4 18.6 24.6 20.4 26.6 22.4 27.2 23.8 26.6 24.6 20.6 28.4 16.4 33.4 13.5Z",
  caida: "M47 11.5C42.6 14.4 35.6 14.6 33.4 20 39.2 20.4 46.4 24.4 50.2 30.2 52 33 52.4 35.4 52.2 38.2A20.2 20.2 0 0 1 11.8 38.4C11.8 31.4 15.8 26 21.8 22.2 26 19.4 32.4 16.4 37 14.4 40.6 13 44 12.4 47 11.5Z",
};

/** @param {string} key @param {number} size @param {string} u prefixo único dos ids */
function moodFaceSvg(key, size, u) {
  if (!PAL[key]) key = "tranquilo";
  const [tip, core, body, edge, F] = PAL[key];
  const shape = { feliz: "viva", apaixonado: "viva", tranquilo: "serena", grato: "serena", ansioso: "viva", irritado: "ericada", triste: "caida", cansado: "sono" }[key];
  // olho da Faísca: grande, escuro, íris colorida e dois brilhos
  const eye = (x, y, rx = 4.3, ry = 5.2, look = 0) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="url(#${u}e)"/>
    <ellipse cx="${x}" cy="${y + ry * .45}" rx="${rx * .72}" ry="${ry * .38}" fill="${edge}" opacity=".55"/>
    <circle cx="${x - rx * .3 + look}" cy="${y - ry * .38}" r="${rx * .42}" fill="#fff"/>
    <circle cx="${x + rx * .38 + look}" cy="${y + ry * .3}" r="${rx * .18}" fill="#fff" opacity=".9"/>`;
  // traços afilados (preenchidos, não linhas de espessura igual)
  const arcUp = (x, y, w = 9, h = 6.2, t = 2.6) => `<path d="M${x - w / 2} ${y}Q${x} ${y - h} ${x + w / 2} ${y}Q${x} ${y - h + t * 1.6} ${x - w / 2} ${y}Z" fill="${F}"/>`;
  const arcDown = (x, y, w = 9, h = 5, t = 2.4) => `<path d="M${x - w / 2} ${y}Q${x} ${y + h} ${x + w / 2} ${y}Q${x} ${y + h - t * 1.6} ${x - w / 2} ${y}Z" fill="${F}"/>`;
  const brow = (x1, y1, x2, y2, bend = 1.4) => {
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 - bend;
    return `<path d="M${x1} ${y1}Q${mx} ${my - 1.6} ${x2} ${y2}Q${mx} ${my + 0.4} ${x1} ${y1}Z" fill="${F}" stroke="${F}" stroke-width=".6" stroke-linejoin="round"/>`;
  };
  const smile = (x, y, w, h) => `<path d="M${x - w / 2} ${y}Q${x} ${y + h} ${x + w / 2} ${y}Q${x} ${y + h * .55} ${x - w / 2} ${y}Z" fill="${F}"/>`;
  const frown = (x, y, w, h) => `<path d="M${x - w / 2} ${y}Q${x} ${y - h} ${x + w / 2} ${y}Q${x} ${y - h * .55} ${x - w / 2} ${y}Z" fill="${F}"/>`;
  const openMouth = (x, y, w, h) => `<path d="M${x - w / 2} ${y}Q${x} ${y - 1} ${x + w / 2} ${y}Q${x + w * .42} ${y + h} ${x} ${y + h}Q${x - w * .42} ${y + h} ${x - w / 2} ${y}Z" fill="url(#${u}m)"/>
    <ellipse cx="${x}" cy="${y + h * .72}" rx="${w * .26}" ry="${h * .26}" fill="#FF8BA0"/>`;
  const blush = `<ellipse cx="20.5" cy="46" rx="4.4" ry="2.6" fill="#FF5A86" opacity=".38" filter="url(#${u}b)"/><ellipse cx="43.5" cy="46" rx="4.4" ry="2.6" fill="#FF5A86" opacity=".38" filter="url(#${u}b)"/>`;
  const heart = (x, y, s, fill = `url(#${u}h)`) => `<g transform="translate(${x - 12 * s} ${y - 11 * s}) scale(${s})"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" fill="${fill}"/><ellipse cx="7.6" cy="7.4" rx="2.6" ry="1.7" fill="#fff" opacity=".8" transform="rotate(-30 7.6 7.4)"/></g>`;
  const drop = (x, y, s = 1) => `<path d="M${x} ${y}q${-3.4 * s} ${5 * s} 0 ${7.4 * s} ${3.4 * s} ${-2.4 * s} 0 ${-7.4 * s}Z" fill="url(#${u}t)"/><ellipse cx="${x - .8 * s}" cy="${y + 4.2 * s}" rx="${.7 * s}" ry="${1.3 * s}" fill="#fff" opacity=".85"/>`;
  const FEAT = {
    feliz: () => blush + arcUp(24.5, 41) + arcUp(39.5, 41) + openMouth(32, 45.5, 10, 6.2),
    tranquilo: () => blush + arcDown(24.5, 39.5) + arcDown(39.5, 39.5) + smile(32, 46, 6.5, 3.2),
    apaixonado: () => blush + heart(24.5, 40.5, .5) + heart(39.5, 40.5, .5) + openMouth(32, 46.5, 7.5, 4.6) + heart(32, -1, .36),
    ansioso: () => brow(19.5, 32, 27, 30.4, -1.2) + brow(44.5, 32, 37, 30.4, -1.2) + eye(24.5, 39.5, 3.9, 5, -.5) + eye(39.5, 39.5, 3.9, 5, -.5)
      + `<path d="M26.5 48.2q1.4-1.8 2.8 0t2.8 0t2.8 0t2.8 0" fill="none" stroke="${F}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>` + drop(49, 22, .9),
    triste: () => brow(19.5, 33.4, 27.5, 31.2, 1.4) + brow(44.5, 33.4, 36.5, 31.2, 1.4) + eye(24.5, 40.5, 4.3, 5.2) + eye(39.5, 40.5, 4.3, 5.2) + frown(32, 50, 7, 3.4) + drop(19.5, 45, .9),
    cansado: () => `<g>${eye(24.5, 41, 4.1, 4.6)}<path d="M19.9 41.4Q24.5 34.6 29.1 41.4Z" fill="${body}"/><path d="M19.9 41.2Q24.5 39.6 29.1 41.2" fill="none" stroke="${F}" stroke-width="1.7" stroke-linecap="round"/></g>
      <g>${eye(39.5, 41, 4.1, 4.6)}<path d="M34.9 41.4Q39.5 34.6 44.1 41.4Z" fill="${body}"/><path d="M34.9 41.2Q39.5 39.6 44.1 41.2" fill="none" stroke="${F}" stroke-width="1.7" stroke-linecap="round"/></g>
      <ellipse cx="32" cy="49" rx="2.4" ry="2.9" fill="url(#${u}m)"/>
      <path d="M44.5 13.5h5.4l-5.4 5.4h5.4" fill="none" stroke="${edge}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 7.5h3.6l-3.6 3.6h3.6" fill="none" stroke="${edge}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>`,
    irritado: () => brow(18.5, 31.2, 28, 35, 0) + brow(45.5, 31.2, 36, 35, 0) + eye(24.5, 41.5, 3.9, 4.4) + eye(39.5, 41.5, 3.9, 4.4) + frown(32, 50.5, 9, 3.4)
      + `<g fill="#fff" opacity=".85"><circle cx="9" cy="30" r="2.2"/><circle cx="6.4" cy="27" r="1.6"/><circle cx="55" cy="30" r="2.2"/><circle cx="57.6" cy="27" r="1.6"/></g>`,
    grato: () => blush + arcUp(24.5, 41, 8.6, 5.4) + arcUp(39.5, 41, 8.6, 5.4) + smile(32, 46, 8, 4)
      + `<path d="M53 5l1.4 3.6 3.6 1.4-3.6 1.4L53 15l-1.4-3.6L48 10l3.6-1.4Z" fill="url(#${u}s)"/><path d="M10 16l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9Z" fill="url(#${u}s)"/>`,
  };
  const P = SHAPE[shape];
  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true" style="overflow:visible">
    <defs>
      <radialGradient id="${u}g" cx=".5" cy=".7" r=".66"><stop offset="0" stop-color="${core}"/><stop offset=".5" stop-color="${body}"/><stop offset="1" stop-color="${edge}"/></radialGradient>
      <linearGradient id="${u}p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${tip}" stop-opacity=".95"/><stop offset=".42" stop-color="${tip}" stop-opacity="0"/></linearGradient>
      <radialGradient id="${u}c" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="${core}" stop-opacity="0"/></radialGradient>
      <radialGradient id="${u}l" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <radialGradient id="${u}e" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#3a2030"/><stop offset="1" stop-color="#12060c"/></radialGradient>
      <linearGradient id="${u}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${F}"/><stop offset="1" stop-color="#14060a"/></linearGradient>
      <linearGradient id="${u}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6A88"/><stop offset="1" stop-color="#C80E3E"/></linearGradient>
      <linearGradient id="${u}t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2EAFF"/><stop offset="1" stop-color="#3F8CFF"/></linearGradient>
      <linearGradient id="${u}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6C4"/><stop offset="1" stop-color="#FFB000"/></linearGradient>
      <filter id="${u}b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.6"/></filter>
      <filter id="${u}d" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
      <clipPath id="${u}x"><path d="${P}"/></clipPath>
    </defs>
    <ellipse cx="32" cy="60.5" rx="16" ry="2.6" fill="${body}" opacity=".55" filter="url(#${u}d)"/>
    <path d="${P}" fill="url(#${u}g)"/>
    <g clip-path="url(#${u}x)">
      <rect x="0" y="0" width="64" height="64" fill="url(#${u}p)"/>
      <ellipse cx="32" cy="47" rx="15" ry="11" fill="url(#${u}c)"/>
      <ellipse cx="20" cy="31" rx="6" ry="3.4" fill="url(#${u}l)" opacity=".75" transform="rotate(-38 20 31)"/>
      <path d="${P}" fill="none" stroke="${edge}" stroke-opacity=".5" stroke-width="2.2"/>
    </g>
    ${FEAT[key]()}
  </svg>`;
}


const MOOD_TINT = Object.fromEntries(Object.entries(PAL).map(([k, v]) => [k, v[2]]));

const SQ = "M21.7 1h20.6C53.7 1 63 10.3 63 21.7v20.6C63 53.7 53.7 63 42.3 63H21.7C10.3 63 1 53.7 1 42.3V21.7C1 10.3 10.3 1 21.7 1Z";
const HEART = "M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z";
const heartAt = (x, y, s, fill) => `<path transform="translate(${x - 12 * s} ${y - 11.5 * s}) scale(${s})" d="${HEART}" fill="${fill}"/>`;
const star4 = (x, y, r, fill) => `<path d="M${x} ${y - r}C${x + r * .18} ${y - r * .18} ${x + r * .18} ${y - r * .18} ${x + r} ${y}C${x + r * .18} ${y + r * .18} ${x + r * .18} ${y + r * .18} ${x} ${y + r}C${x - r * .18} ${y + r * .18} ${x - r * .18} ${y + r * .18} ${x - r} ${y}C${x - r * .18} ${y - r * .18} ${x - r * .18} ${y - r * .18} ${x} ${y - r}Z" fill="${fill}"/>`;

// fundo branco; o desenho a cores, com gradientes, luz e detalhe (mesmo acabamento da Faísca)
const lg = (id, a, b, x2 = 0, y2 = 1) => `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const shine = (id) => `<radialGradient id="${id}" cx=".3" cy=".2" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
const soft = (id) => `<filter id="${id}" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.5" flood-color="#0B1324" flood-opacity=".18"/></filter>`;
const ICONS = {

function featureIconSvg(kind, size, u, opts = {}) {
  const def = ICONS[kind];
  if (!def) return "";
  const frame = (bgFill, inner, shadow) => `<svg viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true" style="filter:drop-shadow(0 ${size * .1}px ${size * .14}px rgba(11,19,36,.10))">
    <defs>
      <linearGradient id="${u}g" x1="0" y1="0" x2="0" y2="1">${bgFill}</linearGradient>
      <radialGradient id="${u}h" cx=".3" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="${u}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".86"/></linearGradient>
      <filter id="${u}s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#000" flood-opacity=".22"/></filter>
      <clipPath id="${u}c"><path d="${SQ}"/></clipPath>
    </defs>
    <path d="${SQ}" style="fill:var(--fi-bg,#fff)"/>
    ${inner}
    <path d="${SQ}" fill="none" style="stroke:var(--fi-line,#ECE8E3)" stroke-width="1.4"/>
  </svg>`;
  if (def.calendar) {
    const d = opts.date || new Date();
    return frame(`<stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/>`, `
      <text x="32" y="20.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing=".6" fill="#F0365F">${DAYS[d.getDay()]}</text>
      <text x="32" y="50" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="600" letter-spacing="-1.2" style="fill:var(--fi-ink,#0B1324)">${d.getDate()}</text>`, "rgba(11,19,36,.16)");
  }
  if (def.humor) {
    const m = opts.mood;
    const tint = m ? MOOD_TINT[m] : "#B8C0CE";
    const face = moodFaceSvg(m || "tranquilo", 48, u + "f").replace('<svg ', `<svg x="8" y="7" opacity="${m ? 1 : .45}" `);
    return frame(`<stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/>`, face
      + (m ? "" : `<circle cx="49" cy="49" r="7" fill="#0B1324"/><path d="M49 45.8v6.4M45.8 49h6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>`), `${tint}55`);
  }
  return frame(`<stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFFFF"/>`,
    `<g transform="translate(32 32) scale(.84) translate(-32 -32)">${def.glyph(u + "x")}</g>`, "");
}
